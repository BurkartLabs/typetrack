<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>typetrack</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <a class="logo" href="#test"><span class="logo-mark">&#9000;</span><span class="logo-text">typetrack</span></a>
    <nav>
      <a href="#test" data-nav="test" class="active">test</a>
      <a href="#stats" data-nav="stats">stats</a>
    </nav>
  </header>

  <main>
    <!-- ── Test view ─────────────────────────────────────────────── -->
    <section id="view-test" class="view">
      <div class="config" id="config">
        <div class="group">
          <button data-mode="time" class="active">time</button>
          <button data-mode="words">words</button>
        </div>
        <span class="sep"></span>
        <div class="group" id="time-opts">
          <button data-duration="15">15</button>
          <button data-duration="30" class="active">30</button>
          <button data-duration="60">60</button>
          <button data-duration="120">120</button>
        </div>
        <div class="group" id="words-opts" hidden>
          <button data-count="25">25</button>
          <button data-count="50" class="active">50</button>
          <button data-count="100">100</button>
        </div>
      </div>

      <div id="typing" class="typing">
        <div class="counter" id="counter">30</div>
        <div class="words-window">
          <div class="words" id="words"></div>
          <div class="caret" id="caret"></div>
        </div>
        <div class="hint">tab &#8212; restart &nbsp;&middot;&nbsp; esc &#8212; restart</div>
      </div>

      <div id="result" class="result" hidden>
        <div class="result-grid">
          <div class="big">
            <div class="label">wpm</div>
            <div class="value" id="r-wpm">0</div>
            <div class="label">acc</div>
            <div class="value" id="r-acc">0%</div>
          </div>
          <div class="chart-box"><canvas id="r-chart" height="180"></canvas></div>
        </div>
        <div class="result-details">
          <div><span class="label">test type</span><span id="r-type"></span></div>
          <div><span class="label">raw</span><span id="r-raw"></span></div>
          <div><span class="label">characters</span><span id="r-chars" title="correct / incorrect / extra / missed"></span></div>
          <div><span class="label">time</span><span id="r-time"></span></div>
        </div>
        <div class="result-actions">
          <button id="next-btn" class="icon-btn" title="next test (tab)">&#8635; next test</button>
        </div>
      </div>
    </section>

    <!-- ── Stats view ────────────────────────────────────────────── -->
    <section id="view-stats" class="view" hidden>
      <div class="config stats-filter">
        <div class="group" id="stats-modes">
          <button data-filter="all" class="active">all</button>
          <button data-filter="time 15">time 15</button>
          <button data-filter="time 30">time 30</button>
          <button data-filter="time 60">time 60</button>
          <button data-filter="time 120">time 120</button>
          <button data-filter="words 25">words 25</button>
          <button data-filter="words 50">words 50</button>
          <button data-filter="words 100">words 100</button>
        </div>
      </div>

      <div class="tiles" id="tiles"></div>

      <div class="chart-box tall">
        <div class="chart-head">
          <span class="chart-title">wpm per test</span>
          <span class="legend"><i class="sw dot"></i>test <i class="sw line"></i>10-test average</span>
        </div>
        <canvas id="s-chart" height="260"></canvas>
        <div class="tooltip" id="s-tip" hidden></div>
        <p class="empty" id="s-empty" hidden>no results yet &#8212; take a test</p>
      </div>

      <table class="recent" id="recent">
        <thead><tr><th>date</th><th>mode</th><th class="num">wpm</th><th class="num">raw</th><th class="num">acc</th></tr></thead>
        <tbody></tbody>
      </table>

      <div class="data-actions">
        <button id="export-btn">export json</button>
        <label class="file-btn">import json<input type="file" id="import-file" accept="application/json,.json"></label>
        <button id="clear-btn" class="danger">clear all</button>
      </div>
    </section>
  </main>

  <script src="words.js"></script>
  <script src="engine.js"></script>
  <script src="app.js"></script>
</body>
</html>
